# Small, reviewable update PRs rather than one painful upgrade a year.
#
# Major versions are ignored for npm: a major is a deliberate upgrade with its
# own story, not a weekly PR. Patch and minor updates, where security fixes
# land, keep arriving.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # The design system's packages move together.
      unitykit:
        patterns: ['@unityevolv/unitykit*']
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
