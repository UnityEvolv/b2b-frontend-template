# Small, reviewable update PRs rather than one painful upgrade a year.
#
# Major versions are ignored for npm: a major is a deliberate upgrade with its
# own pull request, not a weekly one. Patch and minor updates, where security fixes
# land, keep arriving.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # The design system's packages move together.
      unitykit:
        patterns: ['@unityevolv/unitykit*']
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      # The Expo SDK pins these (expo/bundledNativeModules.json): react,
      # react-dom, react-native and its native libraries at exact versions, and
      # the expo packages within one SDK line. They move together with an Expo
      # SDK upgrade (`npx expo install --fix` in apps/mobile), never one by one.
      # React is pinned in every workspace so the web apps, the shared packages
      # and react-native resolve a single copy; its types follow it.
      # These rules name update-types, so they hold back version updates only:
      # security updates still arrive.
      - dependency-name: 'react'
        update-types: ['version-update:semver-minor', 'version-update:semver-patch']
      - dependency-name: 'react-dom'
        update-types: ['version-update:semver-minor', 'version-update:semver-patch']
      - dependency-name: '@types/react'
        update-types: ['version-update:semver-minor']
      - dependency-name: '@types/react-dom'
        update-types: ['version-update:semver-minor']
      - dependency-name: 'react-native'
        update-types: ['version-update:semver-minor', 'version-update:semver-patch']
      - dependency-name: 'react-native-*'
        update-types: ['version-update:semver-minor', 'version-update:semver-patch']
      - dependency-name: '@react-native/*'
        update-types: ['version-update:semver-minor', 'version-update:semver-patch']
      # Patches within the SDK line are fine (the ~57.0.x ranges allow them).
      - dependency-name: 'expo'
        update-types: ['version-update:semver-minor']
      - dependency-name: 'expo-*'
        update-types: ['version-update:semver-minor']
      - dependency-name: '@expo/*'
        update-types: ['version-update:semver-minor']
