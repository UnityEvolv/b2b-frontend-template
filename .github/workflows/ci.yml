# Build, test, lint and drift checks for every ready pull request.
#
# No secret and no write permission: a pull request from a fork runs exactly
# what one from a branch does. A workflow that needs a secret (a deploy, a
# release) keeps it in a job that runs only on the upstream repository from
# main or a tag; check:workflows fails any job that does not.

name: CI

on:
  # Pull requests into main only, and not while a draft: the push to main on
  # merge is not tested again, since the pull request already tested that merge.
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ['**.md', 'docs/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Types
        run: npm run typecheck
      - name: Lint (package boundaries, DOM in shared packages, literal strings, colours)
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: Tests (including axe on the shell)
        run: npm test
      - name: Build the web apps
        env:
          VITE_RELEASE: ${{ github.sha }}
        run: npm run build
      - name: unitykit styles reach every app
        run: npm run check:kit-styles
      - name: API client matches its contracts (generated code is never edited by hand)
        run: npm run check:api-generated
      - name: Web security headers match their definition
        run: npm run check:web-headers
      - name: Built apps carry no inline script the policy would block
        run: npm run check:inline-scripts
      - name: Workflows are read-only by default, and secrets stay on upstream main or tags
        run: npm run check:workflows
      - name: Each example product passes its own checks (its client, build and styles)
        run: npm run check:examples

  # Deleting examples/ leaves a working template: a copy without it installs,
  # type checks, lints, tests and builds. A product that deletes examples/
  # deletes this job with it.
  without-examples:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: The template without examples/
        run: node tools/build-guards/without-examples.mjs

  # Syntax, expressions and the shell in every run step.
  actionlint:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
