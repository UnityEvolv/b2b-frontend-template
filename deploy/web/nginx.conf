# nginx for one static web app: files with long caching, the index for every
# client-side route, the security headers on every response, and the page's
# policy with the origins the org's providers need.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  server_tokens off;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;

  # Non-root nginx keeps its temporary files here.
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  # The org's provider origins, as the rtc service answered them, kept a
  # minute per org: one question per org per minute, not one per page.
  proxy_cache_path /tmp/page-origins keys_zone=page_origins:1m max_size=10m inactive=10m;

  server {
    listen 8080;
    root /usr/share/nginx/html;

    # Rendered from deploy/web/headers.json at container start.
    include /etc/nginx/unityofis/headers.conf;

    # Written at container start: where the org's provider origins are asked
    # (UO-142), or nothing when the API origin is not configured.
    include /etc/nginx/unityofis/page-origins.conf;

    location = /healthz {
      access_log off;
      return 200 'ok';
      add_header Content-Type text/plain;
    }

    # Hashed assets never change: cache them for a year.
    location /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable";
      include /etc/nginx/unityofis/headers.conf;
      try_files $uri =404;
    }

    # The page itself is never cached, so a deploy is seen on the next load.
    location / {
      add_header Cache-Control "no-cache";
      include /etc/nginx/unityofis/headers.conf;
      try_files $uri /index.html;
    }

    # Every client-side route ends here, and only the page needs the org's
    # provider origins in its policy: asked once per page, not per redirect.
    location = /index.html {
      include /etc/nginx/unityofis/page-origins-ask.conf;
      add_header Cache-Control "no-cache";
      include /etc/nginx/unityofis/headers.conf;
    }
  }
}
