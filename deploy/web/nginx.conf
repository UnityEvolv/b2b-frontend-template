# nginx for one static web app: files with long caching, the index for every
# client-side route, and the security headers on every response.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  server_tokens off;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;

  # Non-root nginx keeps its temporary files here.
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  # For the optional per-page policy hook (see README.md): each answer kept a
  # minute per key, one question per key per minute, not one per page.
  # Unused while the hook is off.
  proxy_cache_path /tmp/page-policy keys_zone=page_policy:1m max_size=10m inactive=10m;

  server {
    listen 8080;
    root /usr/share/nginx/html;

    # Rendered from deploy/web/headers.json at container start.
    include /etc/nginx/app/headers.conf;

    # Written at container start: where the optional per-page policy hook is
    # asked, or nothing while it is off.
    include /etc/nginx/app/page-policy.conf;

    location = /healthz {
      access_log off;
      return 200 'ok';
      add_header Content-Type text/plain;
    }

    # Hashed assets never change: cache them for a year.
    location /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable";
      include /etc/nginx/app/headers.conf;
      try_files $uri =404;
    }

    # The page itself is never cached, so a deploy is seen on the next load.
    location / {
      add_header Cache-Control "no-cache";
      include /etc/nginx/app/headers.conf;
      try_files $uri /index.html;
    }

    # Every client-side route ends here, and only the page asks the per-page
    # policy hook, when it is on: once per page, not per redirect.
    location = /index.html {
      include /etc/nginx/app/page-policy-ask.conf;
      add_header Cache-Control "no-cache";
      include /etc/nginx/app/headers.conf;
    }
  }
}
